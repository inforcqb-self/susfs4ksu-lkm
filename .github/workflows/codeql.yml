name: codeql

# Every language this repository has, in one workflow, because a repository may use CodeQL's default
# setup OR advanced configurations but not both: an upload from an advanced configuration is refused
# with "CodeQL analyses from advanced configurations cannot be processed when the default setup is
# enabled", which is what the first run of this workflow hit.  The default setup is therefore off, and
# all three languages live here instead.
#
# c-cpp cannot use the default setup's options for this repository.  `none` analyses the sources
# without a compiler, and kernel headers and macros then resolve badly - noise rather than coverage;
# `autobuild` runs a plain `make` that cannot find this tree's DDK toolchain.  So the module is built
# by hand, in the same image the release build uses, and that compile is what CodeQL traces: the
# database then describes the code as it is actually built.
#
# No pull_request trigger on purpose: on a fork PR the workflow has no `security-events: write`, so the
# upload step would fail for reasons unrelated to the change.  Push to main/dev, a weekly schedule and
# workflow_dispatch cover it.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two builds.  5.15 is the variant the release device runs; 6.18 compiles every >= 6.12 path,
  # including the 6.13/6.16/6.18 guards.  (6.12 shares the static-call implementation but not the
  # later guards.)  Each compile uploads under its own CodeQL category, so the two databases do not
  # replace each other.
  c-cpp:
    name: Analyze (c-cpp, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: android13-5.15, image: "ghcr.io/ylarod/ddk-min:android13-5.15-20260828@sha256:9e68cd9fcab748584755d31ba88ef134efc938dbde17f258c2652315f6cd81cd" }
          - { variant: android17-6.18, image: "ghcr.io/ylarod/ddk-min:android17-6.18-20260828@sha256:fb8b66200bf402cf65a751060fc1aa29524b9fa8840feef16c7b196a4f3f0e6e" }
    container:
      image: ${{ matrix.image }}
      options: --privileged
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The workspace belongs to the runner's user while this job runs as root inside the image, and
      # git then refuses to read it ("detected dubious ownership").
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
      # The same command build-ddk.yml uses, deliberately one line: this Makefile's own comment
      # explains how the trailing-continuation form silently lost ARCH/CC/LLVM and the `modules`
      # target.
      - name: Build susfs_guard_lkm.ko (traced)
        run: |
          set -e
          make -k -C "$KDIR" M="$PWD/kernel" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules -j"$(nproc)"
          ls -la kernel/susfs_guard_lkm.ko
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp/${{ matrix.variant }}"

  python:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # An interpreted language in CodeQL's sense: no build mode argument at all (passing one is an error).
  actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:actions"
